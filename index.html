const SHIFT_TIMES = {

const REST_CODES = ['R', 'RD', 'OFF', 'CRD'];
const LEAVE_CODES = {
    'AL': { text: '年假',     icon: '🏖️' },
    'SL': { text: '病假',     icon: '💊' },
    'SH': { text: '公眾假期', icon: '🎉' },
    'GH': { text: '公眾假期', icon: '🎉' },

    'LS': { text: '長期病假', icon: '💊' }
};

/* ============================================================
   工具函式
   ============================================================ */
function formatDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function getFirstDayOfWeek(date) {
    const dayOfWeek = date.getDay();
    const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const firstDay = new Date(date);
    firstDay.setDate(date.getDate() + diff);
    firstDay.setHours(0, 0, 0, 0);
    return firstDay;
}

function getFirstDayOfWeekByYearWeek(year, week) {
    const firstDayOfYear = new Date(year, 0, 1);
    const firstDayOfFirstWeek = getFirstDayOfWeek(firstDayOfYear);
    const targetWeekMonday = new Date(firstDayOfFirstWeek);
    targetWeekMonday.setDate(firstDayOfFirstWeek.getDate() + (week - 1) * 7);
    return targetWeekMonday;
}

function formatChineseDate(date) {
    const y = date.getFullYear();
    const m = date.getMonth() + 1;
    const d = date.getDate();
    const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    return `${y}年${m}月${d}日 ${days[date.getDay()]}`;
}

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
}

function normalizeCode(code) {
    if (code === null || code === undefined) return '';
    let s = String(code).trim().toUpperCase();
    s = s.replace(/^0+(\d)/, '$1');
    return s;
}

/* ============================================================
   班次模式
   ============================================================ */
const staffRotation = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
const shiftPatterns = {
    'A': ['SP15', 'E', 'E', 'L', 'L', 'R', 'N'],
    'B': ['N',    'N', 'N', 'R', 'R', 'L', 'L'],
    'C': ['L',    'L', 'R', 'E', 'E', 'E', 'E'],
    'D': ['E',    'R', 'L', 'N', 'N', 'N', 'R'],
    'E': ['R',    'SP', 'SP', 'SP', 'SP', 'SP', 'SP'],
    'F': ['SP',   'E', 'E', 'L', 'L', 'R', 'N'],
    'G': ['N',    'N', 'N', 'R', 'R', 'L', 'L'],
    'H': ['L',    'L', 'R', 'E', 'E', 'E', 'E'],
    'I': ['E',    'R', 'L', 'N', 'N', 'N', 'R'],
    'J': ['SP',   'SP', 'SP', 'SP', 'SP', 'SP', 'SP']
};

function getBaseShiftForStaff(staffId, date) {
    const numId = parseInt(staffId, 10);
    if (isNaN(numId) || numId < 1 || numId > 5) return null;

    const baseDate = getFirstDayOfWeekByYearWeek(2025, 53);
    const currentMonday = getFirstDayOfWeek(date);
    const weekDiff = Math.round((currentMonday - baseDate) / (7 * 24 * 60 * 60 * 1000));

    const basePatterns = ['A', 'B', 'C', 'D', 'E'];
    const basePattern = basePatterns[numId - 1] || 'A';
    const baseIndex = staffRotation.indexOf(basePattern);

    let newIndex = (baseIndex + weekDiff) % staffRotation.length;
    if (newIndex < 0) newIndex += staffRotation.length;

    const patternCode = staffRotation[newIndex];
    let dayIndex = date.getDay() - 1;
    if (dayIndex < 0) dayIndex = 6;

    return shiftPatterns[patternCode][dayIndex];
}

function getFinalShiftForStaff(staffId, date, shiftChanges) {
    const dateKey = formatDateKey(date);
    const shiftKey = `staff${staffId}_${dateKey}`;

    if (shiftChanges[shiftKey] && shiftChanges[shiftKey].newShift) {
        return {
            code: shiftChanges[shiftKey].newShift,
            isChanged: true,
            reason: shiftChanges[shiftKey].reason || ''
        };
    }

    const base = getBaseShiftForStaff(staffId, date);
    return { code: base, isChanged: false, reason: '' };
}

/* ============================================================
   分析班次狀態
   ============================================================ */
function analyzeShift(shiftInfo) {
    const { code, isChanged, reason } = shiftInfo;
    const upperReason = (reason || '').trim().toUpperCase();

    if (upperReason === 'SL' || upperReason === 'SICK LEAVE' || upperReason === 'SICK') {
        return { type: 'leave', label: '病假', icon: '💊', code: code || 'SL' };
    }

    if (!code) {
        return { type: 'unknown', label: '無班次記錄', icon: '❓', code: '' };
    }

    const upper = normalizeCode(code);

    if (upper === 'T') {
        return { type: 'class', label: '上堂', icon: '📚', code: 'T' };
    }

    if (upper.startsWith('自訂')) {
        const m = code.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
        if (m) {
            return {
                type: 'work',
                code: '自訂',
                start: m[1].padStart(5, '0'),
                end: m[2].padStart(5, '0'),
                nextDay: false
            };
        }
        return { type: 'unknown', label: '自訂班次', icon: '📌', code: code };
    }

    if (REST_CODES.includes(upper)) {
        return { type: 'rest', label: '休息', icon: '🌙', code: upper };
    }

    if (LEAVE_CODES[upper]) {
        return {
            type: 'leave',
            label: LEAVE_CODES[upper].text,
            icon: LEAVE_CODES[upper].icon,
            code: upper
        };
    }

    if (SHIFT_TIMES[upper]) {
        return {
            type: 'work',
            code: upper,
            start: SHIFT_TIMES[upper].start,
            end: SHIFT_TIMES[upper].end,
            nextDay: SHIFT_TIMES[upper].nextDay
        };
    }

    return { type: 'work-no-time', code: upper };
}

/* ============================================================
   從 Firestore 載入資料
   ============================================================ */
async function loadRosterData() {
    const today = new Date();
    const currentYear = today.getFullYear();

    const monthKeys = new Set();
    for (let i = 0; i < DAYS_TO_SHOW; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() + i);
        monthKeys.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    }

    const staffNamesDoc = await db.collection('rosterData')
        .doc(`staffNames_${currentYear}`)
        .get().catch(() => null);
    const staffNames = (staffNamesDoc && staffNamesDoc.exists)
        ? staffNamesDoc.data()
        : {};

    const shiftChanges = {};
    const monthDocs = await Promise.all(
        Array.from(monthKeys).map(ym => {
            const [y, m] = ym.split('-');
            return db.collection('rosterData')
                .doc(`shiftChanges_${y}_${m}`)
                .get()
                .catch(() => null);
        })
    );
    monthDocs.forEach(doc => {
        if (doc && doc.exists) {
            Object.assign(shiftChanges, doc.data());
        }
    });

    return { staffNames, shiftChanges };
}

function matchTargetStaff(staffNames) {
    const results = [];
    const usedKeywords = new Set();

    for (const [id, rawName] of Object.entries(staffNames)) {
        if (!rawName) continue;
        const name = String(rawName).trim();
        if (!name || name.toLowerCase() === 'vacant') continue;

        const lower = name.toLowerCase();
        for (const target of TARGET_NAMES) {
            if (usedKeywords.has(target.keyword)) continue;
            if (lower.includes(target.keyword.toLowerCase())) {
                results.push({
                    id,
                    name: name,
                    display: target.display,
                    keyword: target.keyword
                });
                usedKeywords.add(target.keyword);
                break;
            }
        }
    }

    results.sort((a, b) =>
        TARGET_NAMES.findIndex(t => t.keyword === a.keyword) -
        TARGET_NAMES.findIndex(t => t.keyword === b.keyword)
    );
    return results;
}

/* ============================================================
   渲染：單日格子
   ============================================================ */
function renderDayCell(staffId, date, shiftChanges, dayOffset) {
    const shiftInfo = getFinalShiftForStaff(staffId, date, shiftChanges);
    const analysis = analyzeShift(shiftInfo);

    let cellClass = 'day-cell';
    if (dayOffset === 0) cellClass += ' today';
    if (analysis.type === 'rest') cellClass += ' is-rest';
    else if (analysis.type === 'leave') cellClass += ' is-leave';
    else if (analysis.type === 'class') cellClass += ' is-class';

    const m = date.getMonth() + 1;
    const d = date.getDate();
    const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const dayName = days[date.getDay()];

    let dateLabel = '';
    if (dayOffset === 0) dateLabel = '<span class="today-badge">今天</span>';
    else if (dayOffset === 1) dateLabel = '<span class="tomorrow-badge">明天</span>';
    else if (dayOffset === 2) dateLabel = '<span class="dayafter-badge">後天</span>';

    const dateHtml = `<div class="day-date">${dateLabel}${m}月${d}日 ${dayName}</div>`;

    let bodyHtml = '';
    if (analysis.type === 'work') {
        const nextDayMark = analysis.nextDay ? '<span class="next-day">(+1)</span>' : '';
        bodyHtml = `
            <div class="time-line start">
                <span class="label">上班</span>
                <span class="value">${analysis.start}</span>
            </div>
            <div class="time-line end">
                <span class="label">下班</span>
                <span class="value">${analysis.end}${nextDayMark}</span>
            </div>
            <span class="shift-badge">班次 ${escapeHtml(analysis.code)}</span>
        `;
    } else if (analysis.type === 'rest') {
        bodyHtml = `
            <div class="rest-info">
                <span class="icon">🌙</span>
                <span class="text">休息</span>
            </div>
        `;
    } else if (analysis.type === 'leave') {
        bodyHtml = `
            <div class="rest-info leave-info">
                <span class="icon">${analysis.icon}</span>
                <span class="text">${escapeHtml(analysis.label)}</span>
            </div>
        `;
    } else if (analysis.type === 'class') {
        bodyHtml = `
            <div class="class-info">
                <span class="icon">📚</span>
                <span class="text">上堂</span>
            </div>
        `;
    } else if (analysis.type === 'work-no-time') {
        bodyHtml = `
            <div class="no-time-info">
                <div class="code">${escapeHtml(analysis.code)}</div>
                <div class="hint">無固定時間</div>
            </div>
        `;
    } else {
        bodyHtml = `<div class="unknown-info"><div class="text">無班次記錄</div></div>`;
    }

    return `<div class="${cellClass}">${dateHtml}${bodyHtml}</div>`;
}

/* ============================================================
   主流程
   ============================================================ */
async function refresh() {
    const content = document.getElementById('content');
    const updatedEl = document.getElementById('updatedAt');
    const today = new Date();

    document.getElementById('todayDate').textContent = formatChineseDate(today);

    try {
        const { staffNames, shiftChanges } = await loadRosterData();
        const matched = matchTargetStaff(staffNames);

        if (matched.length === 0) {
            content.innerHTML = `
                <div class="error">
                    <span class="err-icon">🔍</span>
                    找不到指定員工<br>
                    <span style="font-size:14px; color:#94a3b8;">（請確認 staffNames 內是否包含 Hei Yi / Ng Hei Man）</span>
                </div>
            `;
            return;
        }

        const totalCols = 2;
        let gridHtml = '';

        for (let i = 0; i < totalCols; i++) {
            if (i < matched.length) {
                gridHtml += `<div class="col-header">
                    <span class="icon">👤</span>
                    <span>${escapeHtml(matched[i].display)}</span>
                </div>`;
            } else {
                gridHtml += `<div class="col-header empty">—</div>`;
            }
        }

        for (let d = 0; d < DAYS_TO_SHOW; d++) {
            const date = new Date(today);
            date.setDate(date.getDate() + d);

            for (let i = 0; i < totalCols; i++) {
                if (i < matched.length) {
                    gridHtml += renderDayCell(matched[i].id, date, shiftChanges, d);
                } else {
                    gridHtml += '<div class="day-cell empty"></div>';
                }
            }
        }

        content.innerHTML = `<div class="week-grid">${gridHtml}</div>`;

        const timeStr = today.toLocaleTimeString('zh-HK', {
            hour: '2-digit', minute: '2-digit', hour12: false
        });
        updatedEl.textContent = `最後更新：${timeStr}`;

    } catch (err) {
        console.error('讀取更表失敗：', err);
        content.innerHTML = `
            <div class="error">
                <span class="err-icon">⚠️</span>
                讀取更表資料失敗<br>
                <span style="font-size:14px; color:#94a3b8;">請檢查網絡連線</span>
            </div>
        `;
    }
}

/* ============================================================
   啟動
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
    refresh();
    setInterval(refresh, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();
    });
});
</script>
